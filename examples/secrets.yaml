# Secrets keep sensitive values out of the pipeline definition.
#
# `secrets` declares named providers (`kind` + `config`). A parameter given as
#   {_kind: ref_secret, id: <secret id>}
# is replaced by the provider's value when the pipeline starts, before any step is created.
# A plain value is a static string, i.e. `user: bob` is the same as `{_kind: string, value: bob}`.
#
# Built-in providers:
#   file: `path`  - the file content, without one trailing newline
#   env:  `key`   - the value of an environment variable (it must be set)
#
# Try it from the repository root (the `file` path is relative to the current directory):
#   export MY_ENV_VAR_NAME=my-token
#   echo hello | build/torustiq examples/secrets.yaml
name: Secrets demo

secrets:
  my_secret_file:
    kind: file
    config:
      path: examples/secrets/my_password.txt
  my_env:
    kind: env
    config:
      key: MY_ENV_VAR_NAME

inputs:
  in:
    type: stdin

transforms:
  describe:
    type: lua
    config:
      user: myuser # a static value
      password: # read from the file
        _kind: ref_secret
        id: my_secret_file
      token: # read from the environment
        _kind: ref_secret
        id: my_env
      script: |
        -- The script sees plain values. Secrets should not be printed; show only their lengths.
        function process(msg)
          msg.body = msg.body .. " (user=" .. config.user ..
              ", password: " .. #config.password .. " chars" ..
              ", token: " .. #config.token .. " chars)"
          return msg
        end

outputs:
  out:
    type: stdout
